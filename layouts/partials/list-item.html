<li class="post-item">
  <a href="{{ .RelPermalink }}" class="post-item-inner">

    <!-- Tag dots -->
    <span class="tag-dots">
      {{ range .Params.tags }}
        <span class="tag-dot tag-{{ . | lower }}"></span>
      {{ end }}
    </span>

    <!-- Title + subtitle -->
    <span class="post-text">
      <span class="post-title">{{ .Title }}</span>
      {{ with .Params.subtitle }}
        <span class="post-subtitle">{{ . }}</span>
      {{ end }}
    </span>

    <!-- Date (optional) -->
    {{ with .Date }}
      <span class="post-meta">{{ .Format "Jan 2, 2006" }}</span>
    {{ end }}

  </a>
</li>
